services:
  moveops:
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY를 .env에 설정하세요}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-120}
    depends_on:
      - vllm

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    restart: unless-stopped
    init: true
    ipc: host
    stop_grace_period: 2m
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY를 .env에 설정하세요}
    volumes:
      - vllm-huggingface-cache:/root/.cache/huggingface
      - vllm-compile-cache:/root/.cache/vllm
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - --revision
      - ${VLLM_MODEL_REVISION:-cdbee75f17c01a7cc42f958dc650907174af0554}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-local-vllm-key}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-8}
      - --dtype
      - ${VLLM_DTYPE:-half}
      - --generation-config
      - vllm
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os, urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/v1/models',
          headers={'Authorization': 'Bearer ' + os.environ['VLLM_API_KEY']});
          urllib.request.urlopen(request, timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  vllm-huggingface-cache:
  vllm-compile-cache:
